options:
  auto_refresh: true

scenarios:
  - name: "Service Type - Create and Verify"
    steps:
      - step: "Create service type"
        action: "create"
        model: "service.type"
        save_as: "service_type"
        values:
          name: "Test Service Type"
          code: "TST"

      - step: "Assert service type created"
        action: "assert"
        target: "service_type"
        asserts:
          name:
            type: "value"
            expected: "Test Service Type"
          code:
            type: "value"
            expected: "TST"

  - name: "Service Contract - Full Workflow: draft to done"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner"
          is_company: true

      - step: "Get pricelist"
        action: "ref"
        xml_id: "product.list0"
        save_as: "pricelist"

      - step: "Get admin user"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "admin_user"

      - step: "Create service type"
        action: "create"
        model: "service.type"
        save_as: "service_type"
        values:
          name: "Test Service Type 2"
          code: "TST2"

      - step: "Create service contract"
        action: "create"
        model: "service.contract"
        save_as: "contract"
        values:
          title: "Test Service Contract"
          partner_id: "EVAL: registry['partner'].id"
          type_id: "EVAL: registry['service_type'].id"
          manager_id: "EVAL: registry['admin_user'].id"
          salesperson_id: "EVAL: registry['admin_user'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          currency_id: "REF: base.USD"
          date: "2026-01-01"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert contract in draft state"
        action: "assert"
        target: "contract"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm contract"
        action: "call"
        target: "contract"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve contract"
        action: "call"
        target: "contract"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert analytic account created"
        action: "assert"
        target: "contract"
        asserts:
          analytic_account_id:
            type: "value"
            operator: "is_truthy"

      - step: "Mark contract as done"
        action: "call"
        target: "contract"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"
