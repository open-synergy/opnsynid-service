scenarios:
  - name: "Service Quotation Risk Analysis Lead - Create and Verify"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner QQRAL"
          is_company: true

      - step: "Get pricelist"
        action: "ref"
        xml_id: "product.list0"
        save_as: "pricelist"

      - step: "Get admin user"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "admin_user"

      - step: "Create service type"
        action: "create"
        model: "service.type"
        save_as: "service_type"
        values:
          name: "Test Service Type QQRAL"
          code: "QQRAL"

      - step: "Create service quotation"
        action: "create"
        model: "service.quotation"
        save_as: "quotation"
        values:
          title: "Test Service Quotation QQRAL"
          partner_id: "EVAL: registry['partner'].id"
          type_id: "EVAL: registry['service_type'].id"
          manager_id: "EVAL: registry['admin_user'].id"
          salesperson_id: "EVAL: registry['admin_user'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          currency_id: "REF: base.USD"
          date: "2026-01-01"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert quotation created in draft"
        action: "assert"
        target: "quotation"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm quotation"
        action: "call"
        target: "quotation"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      # WAJIB: refresh: true memaksa _refresh() pustaka (flush + invalidate)
      # sebelum policy approve dibaca. Tanpa refresh eksplisit di sini,
      # approve_ok terbaca dari cache yang diisi action_confirm saat
      # approval.approval belum ada, dan approve gagal secara
      # NONDETERMINISTIK (T-04). Refresh disetel per-step, bukan lewat
      # options: {auto_refresh: true} berkas, agar step ber-as_user lain
      # di skenario ini tidak ikut memicu re-read ber-ACL (T-05).
      - step: "Assert quotation still confirmed (forces cache refresh)"
        action: "assert"
        target: "quotation"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve quotation"
        action: "call"
        target: "quotation"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
