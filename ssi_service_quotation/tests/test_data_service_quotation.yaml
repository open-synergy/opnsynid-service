scenarios:
  - name: "Service Quotation - Full Workflow: draft to win"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner Quotation"
          is_company: true

      - step: "Get pricelist"
        action: "ref"
        xml_id: "product.list0"
        save_as: "pricelist"

      - step: "Get admin user"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "admin_user"

      - step: "Create service type"
        action: "create"
        model: "service.type"
        save_as: "service_type"
        values:
          name: "Test Service Type QUO"
          code: "TSTQUO"

      - step: "Create service quotation"
        action: "create"
        model: "service.quotation"
        save_as: "quotation"
        values:
          title: "Test Service Quotation"
          partner_id: "EVAL: registry['partner'].id"
          type_id: "EVAL: registry['service_type'].id"
          manager_id: "EVAL: registry['admin_user'].id"
          salesperson_id: "EVAL: registry['admin_user'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          currency_id: "REF: base.USD"
          date: "2026-01-01"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Assert quotation in draft state"
        action: "assert"
        target: "quotation"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm quotation"
        action: "call"
        target: "quotation"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "quotation"
        method: "invalidate_cache"

      - step: "Approve quotation"
        action: "call"
        target: "quotation"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "quotation"
        method: "invalidate_cache"

      - step: "Mark quotation as win"
        action: "call"
        target: "quotation"
        method: "action_win"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "win"

      - step: "Invalidate cache after win"
        action: "call"
        target: "quotation"
        method: "invalidate_cache"

      - step: "Assert contract created"
        action: "assert"
        target: "quotation"
        asserts:
          contract_id:
            type: "value"
            operator: "is_truthy"
