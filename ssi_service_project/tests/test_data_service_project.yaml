scenarios:
  - name: "Service Project - Create and Verify with Auto Project"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner PRJ"
          is_company: true

      - step: "Get pricelist"
        action: "ref"
        xml_id: "product.list0"
        save_as: "pricelist"

      - step: "Get admin user"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "admin_user"

      - step: "Create service type with auto create project"
        action: "create"
        model: "service.type"
        save_as: "service_type"
        values:
          name: "Test Service Type PRJ"
          code: "TSTPRJ"
          auto_create_project: true

      - step: "Create service contract with auto create project"
        action: "create"
        model: "service.contract"
        save_as: "contract"
        values:
          title: "Test Service Contract Project"
          partner_id: "EVAL: registry['partner'].id"
          type_id: "EVAL: registry['service_type'].id"
          manager_id: "EVAL: registry['admin_user'].id"
          salesperson_id: "EVAL: registry['admin_user'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          currency_id: "REF: base.USD"
          date: "2026-01-01"
          date_start: "2026-01-01"
          date_end: "2026-12-31"
          auto_create_project: true

      - step: "Assert contract created in draft"
        action: "assert"
        target: "contract"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm contract"
        action: "call"
        target: "contract"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "contract"
        method: "invalidate_cache"

      - step: "Approve contract"
        action: "call"
        target: "contract"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "contract"
        method: "invalidate_cache"

      - step: "Assert project created"
        action: "assert"
        target: "contract"
        asserts:
          project_id:
            type: "value"
            operator: "is_truthy"
